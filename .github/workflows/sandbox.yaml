name: ⚙️ Sandbox
on:
  push: 
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sandbox-queue
  queue: max
  
jobs:
  build:
    
        
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6
      - run: date > foo.txt
      - run: git add .
      - uses: qoomon/actions--create-commit@main
        with:
          message: moin


  
      
