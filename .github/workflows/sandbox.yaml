name: ⚙️ Sandbox
on:
  push: 
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sandbox-queue
  queue: max
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: qoomon/github-profile-trophy@master
        with:
          title: LongTimeUser
          path: ./trophy.svg
      - uses: actions/upload-artifact@v7
        with:
          path: ./trophy.svg


  
      
